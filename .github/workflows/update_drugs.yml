name: 毎日データ更新

on:
  schedule:
  - cron: '10 14 * * *'  # 日本時間 毎日23時10分
  workflow_dispatch:       # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリインストール
        run: pip install openpyxl requests pytz pypdf

      - name: 供給状況Excel ダウンロード（厚労省ページからリンク取得）
        run: |
          python3 - <<'EOF'
          import requests, re
          PAGE = "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryou/kouhatu-iyaku/04_00003.html"
          r = requests.get(PAGE, timeout=30); r.raise_for_status()
          m = re.search(r'href="([^"]+\.xlsx)"', r.text)
          if not m:
              print("❌ ページ内にxlsxリンクが見つかりません"); exit(1)
          href = m.group(1)
          if href.startswith("/"):
              href = "https://www.mhlw.go.jp" + href
          print(f"取得URL: {href}")
          r2 = requests.get(href, timeout=60); r2.raise_for_status()
          with open("supply_latest.xlsx", "wb") as f:
              f.write(r2.content)
          print(f"✅ ダウンロード成功: {len(r2.content)} bytes")
          EOF

      - name: 供給状況だけ更新（既存CSVの薬価・メーカーは保持）
        run: |
          python3 - <<'EOF'
          import openpyxl, datetime, csv

          def to_date(v):
              if v is None or v == "": return ""
              if hasattr(v, "strftime"): return v.strftime("%Y/%m/%d")
              try:
                  n = int(float(v)); return (datetime.date(1899,12,30)+datetime.timedelta(days=n)).strftime("%Y/%m/%d")
              except: return str(v)
          def s(v): return str(v).strip() if v is not None else ""

          wb = openpyxl.load_workbook("supply_latest.xlsx", read_only=True, data_only=True)
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))
          hidx = None
          for i, r in enumerate(rows[:6]):
              if r and any(str(c).startswith("①") for c in r if c):
                  hidx = i; break
          if hidx is None:
              print("❌ ヘッダー行が見つかりません"); exit(1)
          data = [r for r in rows[hidx+1:] if r and r[4]]
          if len(data) < 10000:
              print(f"❌ 供給データが少なすぎます({len(data)}件)。誤ダウンロードの可能性があるため中断"); exit(1)

          # Excel列: 1②薬効 2③成分 3④規格 4⑤YJ 5⑥品名 6⑦製販 11⑫状況 13⑭理由 14⑮ 16⑰ 19⑳ 20㉑
          xl = {}
          for r in data:
              yj = s(r[4])
              kaijo = s(r[14]) or "－"; ryo = s(r[16]) or "－"
              xl[yj] = dict(
                  jokyo=s(r[11]), riyu=s(r[13]),
                  daitai=f"解除/解消見込み: {kaijo} / 出荷量状況: {ryo}",
                  date=to_date(r[19]), new=("New" if s(r[20]) == "New" else ""),
                  name=s(r[5]), ippan=s(r[2]), kikaku=s(r[3]), yakkou=s(r[1]), seizou=s(r[6]),
              )

          # 既存CSVをcsvモジュールで厳密に読む（メーカー欄に半角カンマ・クォートを含むため）
          with open("drugs_app_ready.csv", encoding="utf-8-sig", newline="") as f:
              allrows = list(csv.reader(f))
          header = allrows[0]
          out = [header]; seen = set()
          # 既存行: Excelにある品目は供給5列(状況/理由/代替/更新日/今回更新)のみ更新、それ以外の列は保持
          for c in allrows[1:]:
              if len(c) < 14: continue
              yj = c[9].strip()
              if yj in xl:
                  x = xl[yj]; c = c[:]
                  c[4], c[5], c[6], c[7], c[8] = x["jokyo"], x["riyu"], x["daitai"], x["date"], x["new"]
                  out.append(c); seen.add(yj)
              # Excel(公式一覧)に無い既存品目はドロップ
          # Excelの新規品目を追加（薬価・販売メーカーは空。次回ローカル変換で補完）
          for yj, x in xl.items():
              if yj in seen: continue
              out.append([x["name"], x["ippan"], x["seizou"], "", x["jokyo"], x["riyu"],
                          x["daitai"], x["date"], x["new"], yj, x["yakkou"], x["kikaku"], "", ""])

          with open("drugs_app_ready.csv", "w", encoding="utf-8-sig", newline="") as f:
              csv.writer(f, lineterminator="\n").writerows(out)
          print(f"✅ 更新完了: 既存更新 {len(seen)}件 / 新規追加 {len(xl)-len(seen)}件 / 総 {len(out)-1}行")
          EOF

      - name: version.json 更新（単調増加 YYYYMMDDHHMM）
        run: |
          python3 - <<'EOF'
          import json, datetime, pytz
          jst = pytz.timezone("Asia/Tokyo"); now = datetime.datetime.now(jst)
          version = int(now.strftime("%Y%m%d%H%M"))
          data = {
              "version": version,
              "csv_url": "https://raw.githubusercontent.com/tkiyo1007-eng/drugs-data/main/drugs_app_ready.csv",
              "note": f"{now.strftime('%Y年%m月%d日')}厚労省データ反映",
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"✅ version.json更新: {version}")
          EOF

      - name: メーカー案内文(PDF)を取得してマッチング
        run: python3 scripts/fetch_maker_announcements.py drugs_app_ready.csv maker_announcements.json 2 30
        continue-on-error: true  # メーカーサイト側の一時的な障害でデータ更新自体を止めない

      - name: 案内文PDFから包装単位を抽出（新規URLのみ）
        run: python3 scripts/extract_pdf_packages.py maker_announcements.json announcement_packages.json 60
        continue-on-error: true

      - name: 不要ファイル削除
        run: rm -f supply_latest.xlsx

      - name: GitHubにプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drugs_app_ready.csv version.json maker_announcements.json announcement_packages.json packages_cache.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "データ自動更新: $(TZ=Asia/Tokyo date +'%Y/%m/%d')"
          git pull --rebase origin main || true
          git push
