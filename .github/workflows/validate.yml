name: Validate data pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 検証する公開対象の完全なcommit SHA
        required: true
        type: string
      core_release:
        description: 定刻・手動公開で既存の任意メーカー更新境界を維持する
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 回帰テスト用の依存関係を準備
        run: python3 -m pip install openpyxl
      - name: Python構文検査
        run: python3 -m py_compile scripts/*.py
      - name: 回帰テスト
        if: ${{ !inputs.core_release }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: コア公開境界の回帰テスト
        if: inputs.core_release
        run: python3 scripts/check_core_release.py --run-regressions
      - name: 現行供給CSV品質検査
        run: python3 scripts/validate_supply_data.py --csv drugs_app_ready.csv
      - name: 規格比較と供給データの対応を検査
        if: ${{ !inputs.core_release }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from source_specification import valid_comparison
          doc = json.loads(Path('specification_differences.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('mhlw_source.json').read_text(encoding='utf-8'))
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          if not valid_comparison(doc, meta, Path('drugs_app_ready.csv').read_bytes(), version):
              raise SystemExit('規格比較とCSV・原表の対応を確認できません')
          PY
      - name: 公開中のWebがCSVを読み込めるか検査
        run: python3 scripts/check_web_client_csv.py --html index.html --csv drugs_app_ready.csv
      - name: 変更履歴の型・日付・供給区分検査
        run: |
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          from check_public_data_health import validate_supporting_document
          errors = validate_supporting_document('status_changes.json', json.load(open('status_changes.json')))
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
      - name: 現行メーカー案内データ品質検査
        if: ${{ !inputs.core_release }}
        run: python3 scripts/validate_maker_announcements.py --min-count 300
      - name: 整合済み保持メーカー情報のコア公開検査
        if: inputs.core_release
        run: python3 scripts/check_core_release.py --min-count 300
      - name: 販売中止・包装変更データ品質検査
        run: >-
          python3 scripts/validate_product_lifecycle.py product_lifecycle.json
          --csv drugs_app_ready.csv
          --max-missing-announced-rate 0
      - name: 供給情報差異データ品質検査
        run: |
          python3 scripts/validate_supply_discrepancies.py
          python3 scripts/build_supply_discrepancies.py
          git diff --exit-code -- supply_discrepancies.json
      - name: Web・iOS共通設定の検査
        run: python3 scripts/validate_shared_content.py
      - name: 原典確認済みメーカー案内と速報収集状態の検査
        run: |
          python3 scripts/validate_manufacturer_notices.py
          python3 scripts/fetch_manufacturer_bulletins.py --validate-only --base .
      - name: 話題・注目製品・供給確認ガイドの再生成確認
        run: |
          python3 scripts/generate_curated_pages.py --csv drugs_app_ready.csv --site .
          # 新規ファイル（未追跡）も検出するため git diff ではなく status を使う
          changes=$(git status --porcelain -- topics products guides ingredients categories reports sitemap-curated.xml)
          if [ -n "$changes" ]; then echo "$changes"; exit 1; fi
