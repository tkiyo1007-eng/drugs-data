name: Deploy GitHub Pages
run-name: ${{ inputs.recovery_source != '' && format('供給更新の自動復旧 {0}', inputs.recovery_source) || github.event.workflow_run.name == 'PMDA回収情報を更新' && 'PMDA回収情報の公開' || 'Deploy GitHub Pages' }}

on:
  workflow_run:
    workflows: ['Validate data pipeline', '毎日データ更新', 'PMDA回収情報を更新']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      supply_import:
        description: 検証済み供給データの取込からの公開
        type: boolean
        default: false
      recovery_source:
        description: 自動復旧が確認した取込済み原表の日付とSHA-256
        type: string
        required: false

permissions:
  contents: read

jobs:
  target:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.name == 'Validate data pipeline' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.name == '毎日データ更新' &&
         github.event.workflow_run.display_title == '毎日データ更新' &&
         (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
         (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.name == 'PMDA回収情報を更新' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))) ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        uses: actions/github-script@v8
        env:
          SUPPLY_IMPORT: ${{ inputs.supply_import }}
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const current = branch.commit.sha;
            // 供給データの取込・回収更新からの公開は、現在のmainを改めて検証する。
            const run = context.payload.workflow_run;
            const recallUpdate = run?.name === 'PMDA回収情報を更新';
            const dataUpdate = process.env.SUPPLY_IMPORT === 'true' || run?.name === '毎日データ更新' || recallUpdate;
            if (recallUpdate && run.head_sha === current) {
              core.notice('回収情報の公開内容に変更がありません');
              return;
            }
            const validated = run?.head_sha || context.sha;
            if (!dataUpdate && validated && validated !== current) {
              core.notice('検証後にmainが進んだため、古い対象の公開をスキップします');
              return;
            }
            core.setOutput('sha', current);
  # 自動復旧の取込は直接起動し、通常の日次更新は完了イベントで公開する。
  validate:
    needs: target
    if: >-
      needs.target.outputs.sha != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Validate data pipeline')
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      core_release: true
  # 先にアップロードを完了し、別のジョブで公開する（actions/deploy-pages#451）。
  prepare_publication:
    needs: [target, validate]
    if: >-
      always() && needs.target.result == 'success' && needs.target.outputs.sha != '' &&
      ((github.event_name == 'workflow_run' && needs.validate.result == 'skipped') ||
       needs.validate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.value }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - id: artifact_name
        run: printf 'value=%s\n' "$PAGES_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 最新の公表情報からニュース欄のデータを生成
        run: python3 scripts/build_official_news.py
      - name: 検証したartifactの配信整合性表を作成
        env:
          SOURCE_COMMIT: ${{ needs.target.outputs.sha }}
        run: >-
          python3 scripts/public_data_manifest.py --site .
          --commit "$SOURCE_COMMIT" --output public-data-manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}
  deploy:
    needs: [target, prepare_publication]
    # main の検証が別の実行ですでに成功している場合、この実行の validate は
    # skipped。暗黙の success() では、その skip が deploy にも伝播する。
    if: >-
      !cancelled() && needs.target.result == 'success' &&
      needs.prepare_publication.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: ${{ needs.prepare_publication.outputs.artifact_name }}
      PAGES_ARTIFACT_ID: ${{ needs.prepare_publication.outputs.artifact_id }}
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: アップロードした公開ファイルが参照可能になるまで待機
        uses: actions/github-script@v8
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            const id = process.env.PAGES_ARTIFACT_ID;
            if (!/^[1-9]\d*$/.test(id || '')) throw new Error('公開ファイルのアップロードIDを取得できません');

            for (let attempt = 1; attempt <= 6; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name, per_page: 2,
                request: {signal: AbortSignal.timeout(5000)},
              });
              if (data.total_count > 1) throw new Error(`同名の公開ファイルが複数あります: ${name}`);
              const artifact = data.artifacts[0];
              if (artifact) {
                if (artifact.expired || String(artifact.id) !== id) {
                  throw new Error(`公開ファイルが今回アップロードしたIDと一致しないか、有効期限切れです: ${name}`);
                }
                core.info(`公開ファイルを確認しました: ${name} (${id})`);
                return;
              }
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`公開ファイルが参照可能になりませんでした: ${name}`);
      - name: 公開直前にmainの一致を再確認
        id: current
        uses: actions/github-script@v8
        env:
          SOURCE_COMMIT: ${{ needs.target.outputs.sha }}
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const current = branch.commit.sha === process.env.SOURCE_COMMIT;
            core.setOutput('matches', String(current));
            if (!current) core.notice('検証中にmainが進んだため、古いartifactを公開しません');
      - id: deployment
        if: steps.current.outputs.matches == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: 公開サイトの原表反映を確認
        if: steps.deployment.outcome == 'success' && inputs.supply_import
        uses: actions/github-script@v8
        env:
          SOURCE_COMMIT: ${{ needs.target.outputs.sha }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const read = async (name) => {
              const response = await fetch(`https://kyokyu-navi.jp/${name}?release_check=${Date.now()}`,
                { signal: AbortSignal.timeout(7000) });
              if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
              return Buffer.from(await response.arrayBuffer());
            };
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const manifest = JSON.parse(await read('public-data-manifest.json'));
                if (manifest.source_commit !== process.env.SOURCE_COMMIT) {
                  throw new Error('今回の公開commitを配信中の整合性表で確認できません');
                }
                const body = await read('mhlw_source.json');
                const entry = manifest.files['mhlw_source.json'];
                if (entry.bytes !== body.length || entry.sha256 !== createHash('sha256').update(body).digest('hex')) {
                  throw new Error('公開中の原表メタデータが今回の公開ファイルと一致しません');
                }
                const source = JSON.parse(body);
                core.notice(`原表反映を確認: ${source.excel_date} ${source.sha256}`);
                return;
              } catch (error) {
                if (attempt === 6) throw error;
                core.info(`公開反映待ち (${attempt}/6): ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
