name: X自動投稿（供給状況の変更）

# Pages公開の成功後に、最新の変更日を1回だけ投稿する。リンク先の日別ページが
# 公開済みであることを確認してから投稿する。
# 実投稿は リポジトリ変数 X_POSTING_ENABLED=true かつ Secrets 4件が揃ったときだけ。
# それ以外（初期状態・手動実行の既定）は文面を作ってSummaryに出すだけの試運転。
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 試運転（投稿しない）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: x-daily-post
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: X認証の確認（手動実行時のみ・投稿しない）
        if: github.event_name == 'workflow_dispatch'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/x_daily_post.py whoami
      - name: 投稿文を作成（変更記録がある日だけ）
        id: plan
        run: |
          python3 scripts/x_daily_post.py build --out "$RUNNER_TEMP/x_post.json"
          echo "action=$(python3 -c "import json,sys;print('post' if any(p['action']=='post' for p in json.load(open(sys.argv[1]))['posts']) else 'skip')" "$RUNNER_TEMP/x_post.json")" >> "$GITHUB_OUTPUT"
      - name: リンク先の日別ページが公開済みか確認
        if: steps.plan.outputs.action == 'post'
        run: |
          python3 -c "import json,sys;[print(p['url']) for p in json.load(open(sys.argv[1]))['posts'] if p['action']=='post']" "$RUNNER_TEMP/x_post.json" > "$RUNNER_TEMP/x_urls.txt"
          while read -r url; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null "$url"; then ok=true; break; fi
              sleep 20
            done
            if [ "$ok" != true ]; then echo "::error::リンク先が公開されていないため投稿しません: $url"; exit 1; fi
            echo "公開を確認: $url"
          done < "$RUNNER_TEMP/x_urls.txt"
      - name: 実投稿するか判定
        id: mode
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          ENABLED: ${{ vars.X_POSTING_ENABLED }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLAN: ${{ runner.temp }}/x_post.json
        run: |
          live=false
          if [ "$ACTION" = "post" ] && [ "$ENABLED" = "true" ]; then
            if [ "$EVENT" != "workflow_dispatch" ] || [ "$DRY_RUN" = "false" ]; then live=true; fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          {
            echo "## X自動投稿"
            if [ "$ACTION" = "post" ]; then
              if [ "$live" = "true" ]; then echo "モード: 本投稿"; else echo "モード: 試運転（投稿しません）"; fi
            fi
            python3 - "$PLAN" <<'PY'
          import json, sys
          for post in json.load(open(sys.argv[1]))["posts"]:
              print(f"\n### {post.get('kind')}")
              if post["action"] == "post":
                  print("```\n" + post["text"] + "\n```")
              else:
                  print("投稿なし: " + post.get("reason", ""))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Xへ投稿
        if: steps.mode.outputs.live == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/x_daily_post.py post --plan "$RUNNER_TEMP/x_post.json"
      - name: 投稿記録を保存（二重投稿の防止）
        if: steps.mode.outputs.live == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_post_log.json
          git diff --cached --quiet && exit 0
          git commit -m "X投稿記録: $(TZ=Asia/Tokyo date +'%Y/%m/%d')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
